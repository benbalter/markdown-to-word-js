name: Feature request
description: Suggest something Markdown to Word should do that it doesn't.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the problem, not just the solution. "My tables lose their column widths" is more useful than "add a table option."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where would you use this?
      multiple: true
      options:
        - md2word.app (browser)
        - Node library
        - Bundled into my own web app
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Alternatives you've tried, sample Markdown, or links to how other tools handle it.
