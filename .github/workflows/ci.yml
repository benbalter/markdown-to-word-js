name: CI

# Checks every push and PR. Deploys don't come from here: Cloudflare Workers
# Builds deploys main (and previews branches) on its own, after running
# `npm run build && npm test` (see docs/cloudflare.md).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # astro check + astro build, which also runs the SEO / accessibility /
      # performance checks (@nuasite/checks) and fails on errors.
      - run: npm run build
      - run: npm test

      # Validate wrangler.jsonc and the assets bundle without deploying.
      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: npm run test:e2e
      # Keep the Playwright report and traces so a failed run is debuggable
      # from the Actions run.
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
