name: Release

# Publishes the package to npm when a GitHub Release is published. The release
# tag (e.g. v0.1.0) must match the version in package.json. Publishing doesn't
# touch the site: Cloudflare Workers Builds deploys md2word.app from main.
#
# Authentication uses npm Trusted Publishing (OIDC), so there's no long-lived
# token. One-time setup on npmjs.com: on the package's Settings → Trusted
# Publisher, add this repo (benbalter/markdown-to-word-js) with workflow
# filename "release.yml" and environment "npm". npm's UI requires the package
# to already exist, so the very first version must be published manually to
# claim the name (see CONTRIBUTING.md).

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          # .nvmrc's Node 24 bundles npm 11, which meets trusted publishing's
          # npm >= 11.5.1 requirement without a global upgrade.
          node-version-file: .nvmrc
          # No dependency cache in the publishing job: a poisoned cache entry
          # from another workflow must never reach what we ship.
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      # Verify the registry signatures of installed dependencies before
      # shipping, matching the provenance this publish emits.
      - name: Verify dependency signatures
        run: npm audit signatures
      - name: Verify tag matches package.json version
        # Pass the tag via env, never ${{ }} inside the script (template injection).
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$RELEASE_TAG" ]; then
            echo "Release tag $RELEASE_TAG does not match package.json version $pkg" >&2
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      # `prepack` builds build/ clean. No token: OIDC authenticates via
      # id-token, and provenance is automatic.
      - run: npm publish
